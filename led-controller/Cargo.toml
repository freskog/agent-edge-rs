[package]
name = "led-controller"
version = "0.1.0"
edition = "2021"
description = "HTTP server for controlling the ReSpeaker LED ring (4-mic array)"
license = "MIT"

[[bin]]
name = "led_controller"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
i2cdev = "0.6"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
alsa-volume = { path = "../alsa-volume" }
