[package]
name = "spotify-control"
version = "0.1.0"
edition = "2021"
description = "REST service that controls spotifyd locally over D-Bus (MPRIS + rs.spotifyd.Controls)"
license = "MIT"

[[bin]]
name = "spotify-control"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
