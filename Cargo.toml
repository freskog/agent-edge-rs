[package]
name = "audio"
version = "0.1.0"
edition = "2021"
authors = ["Fredrik Skogberg <freskog@gmail.com>"]
description = "Binary Audio Service with integrated wakeword detection and VAD processing"
license = "MIT"

[workspace]
members = ["alsa-volume", "spotify-control", "led-controller"]

[dependencies]
cpal = "0.16.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.0", features = ["derive"] }
crossbeam = "0.8"
ringbuf = "0.4"
ctrlc = "3.4"
libc = "0.2"
serde_json = "1"
alsa-volume = { path = "alsa-volume" }

# Wakeword detection dependencies
voice_activity_detector = "0.2.0"        # VAD processing (also pulls in ort/ONNX Runtime)
tflitec = { path = "./tflitec-rs-fork" } # TensorFlow Lite models

[build-dependencies]
