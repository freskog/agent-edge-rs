# /etc/assistant/alsa/usb.conf
#
# ALSA configuration for USB mode: the XVF3800 running its official USB DFU
# firmware (respeaker_xvf3800_usb_dfu_firmware_v2.0.9_48k.bin). The USB Audio
# Class device enumerates as ALSA card "Array", bidirectional on device 0.
# Hardware advertises a single configuration: S16_LE @ 48 kHz, 2 channels.
#
# Chain (mirrors i2s.conf shape so the same xvf_* alias names keep working;
# only the underlying hw target and the capture slave format change):
#   xvf_hw_play/xvf_hw_cap  -> hw:Array,0      (bidirectional, dev 0)
#   xvf_cap_rt (dsnoop)     -> xvf_hw_cap      (48k S16_LE 2ch)
#   xvf_dmix                -> xvf_hw_play     (48k S16_LE 2ch)
#   xvf_softvol             -> xvf_dmix        (control "XVF3800 SoftMaster")
#   xvf_out (plug)          -> xvf_softvol
#   pcm.!default = asym(playback=xvf_out, capture=xvf_cap)
#
# The softvol control name is intentionally identical to the I2S config so
# audio.service (--mixer-name), spotifyd.service (--control), led_engine.rs
# (MIXER_NAME), and alsa_volume::set_volume(MIXER_NAME, ...) keep working
# without code changes. Only the host card the virtual control is registered
# against changes (XVF3800 -> Array).

pcm.xvf_hw_play {
  type hw
  card Array
  device 0
}

pcm.xvf_hw_cap {
  type hw
  card Array
  device 0
}

ctl.xvf_hw {
  type hw
  card Array
}

pcm.xvf_cap_rt {
  type dsnoop
  # Keys are deliberately far apart from xvf_dmix to avoid hash collisions
  # in alsa-lib's pcm_direct shm key derivation. With both dsnoop and dmix
  # at S16_LE/48k/2ch on the USB card, close ipc_keys (e.g. 2024/2025)
  # produce overlapping derived shm keys and dsnoop fails to attach.
  ipc_key 0x30000
  ipc_perm 0666
  slave {
    pcm "xvf_hw_cap"
    rate 48000
    format S16_LE
    channels 2
    period_time 0
    period_size 1024
    buffer_size 8192
  }
}

pcm.xvf_cap {
  type plug
  slave.pcm "xvf_cap_rt"
}

pcm.xvf_dmix {
  type dmix
  ipc_key 0x40000
  ipc_perm 0666
  slave {
    pcm "xvf_hw_play"
    rate 48000
    format S16_LE
    channels 2
    period_time 0
    period_size 1024
    buffer_size 16384
  }
}

pcm.xvf_softvol {
  type softvol
  slave.pcm "xvf_dmix"
  control {
    name "XVF3800 SoftMaster"
    card Array
  }
  min_dB -60.0
  max_dB 0.0
  resolution 256
}

pcm.xvf_out {
  type plug
  slave.pcm "xvf_softvol"
}

pcm.!default {
  type asym
  playback.pcm "xvf_out"
  capture.pcm  "xvf_cap"
}

ctl.!default {
  type hw
  card Array
}
