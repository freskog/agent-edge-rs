# /etc/assistant/alsa/jabra.conf
#
# ALSA configuration for JABRA mode: the Jabra Speak2 75 USB speakerphone
# (ALSA card "J75", device 0). The Jabra performs its own hardware acoustic
# echo cancellation, so no XVF3800 is involved in this path.
#
# Unlike i2s.conf / usb.conf this config has NO softvol layer: volume is owned
# by the device's native hardware mixer control "PCM" (amixer/spotifyd/cpal all
# reach it through ctl.!default below). The other configs share the softvol
# name "XVF3800 SoftMaster"; jabra mode instead requires consumers to point at
# the hardware control "PCM" (see audio.service --mixer-name, spotifyd.service
# --control, led_engine.rs MIXER_NAME).
#
# Hardware (from `--dump-hw-params` and /proc/asound/J75/stream0):
#   Playback: S16_LE, 2ch (FL FR), 8k-48k   -> dmix @ 48k S16_LE 2ch
#   Capture : S16_LE, 1ch, fixed 32000 Hz   -> dsnoop @ 32k S16_LE 1ch
#
# Chain (reuses the xvf_* alias names from i2s/usb so nothing downstream cares;
# only the underlying hw target, slave formats, and the missing softvol differ):
#   xvf_hw_play/xvf_hw_cap -> hw:J75,0
#   xvf_cap_rt (dsnoop)    -> xvf_hw_cap   (32k S16_LE 1ch)
#   xvf_cap (plug)         -> xvf_cap_rt   (cpal asks 16k mono; plug resamples)
#   xvf_dmix               -> xvf_hw_play  (48k S16_LE 2ch)
#   xvf_out (plug)         -> xvf_dmix     (mono->stereo upmix; no softvol)
#   pcm.!default = asym(playback=xvf_out, capture=xvf_cap)
#   ctl.!default = hw:J75  (so the "PCM"/"Headset" controls resolve by default)

pcm.xvf_hw_play {
  type hw
  card J75
  device 0
}

pcm.xvf_hw_cap {
  type hw
  card J75
  device 0
}

ctl.xvf_hw {
  type hw
  card J75
}

pcm.xvf_cap_rt {
  type dsnoop
  # Keys are deliberately far apart from i2s (0x10000/0x20000) and usb
  # (0x30000/0x40000) so the per-segment derived shm keys never collide.
  ipc_key 0x50000
  ipc_perm 0666
  slave {
    pcm "xvf_hw_cap"
    rate 32000
    format S16_LE
    channels 1
    period_time 0
    period_size 1024
    buffer_size 8192
  }
}

pcm.xvf_cap {
  type plug
  slave.pcm "xvf_cap_rt"
}

pcm.xvf_dmix {
  type dmix
  ipc_key 0x60000
  ipc_perm 0666
  slave {
    pcm "xvf_hw_play"
    rate 48000
    format S16_LE
    channels 2
    period_time 0
    period_size 1024
    buffer_size 16384
  }
}

pcm.xvf_out {
  type plug
  slave.pcm "xvf_dmix"
}

pcm.!default {
  type asym
  playback.pcm "xvf_out"
  capture.pcm  "xvf_cap"
}

ctl.!default {
  type hw
  card J75
}
