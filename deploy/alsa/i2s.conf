# /etc/assistant/alsa/i2s.conf
#
# ALSA configuration for I2S mode: the bcm2835-i2s + simple-card stack
# created by `dtoverlay=xvf3800` (ALSA card name: XVF3800).
#
# Chain:
#   xvf_hw_play/xvf_hw_cap  -> hw:XVF3800
#   xvf_cap_rt (dsnoop)     -> xvf_hw_cap   (48k S32_LE 2ch)
#   xvf_dmix                -> xvf_hw_play  (48k S16_LE 2ch)
#   xvf_softvol             -> xvf_dmix     (control "XVF3800 SoftMaster")
#   xvf_out (plug)          -> xvf_softvol
#   pcm.!default = asym(playback=xvf_out, capture=xvf_cap)

pcm.xvf_hw_play {
  type hw
  card XVF3800
  device 0
}

pcm.xvf_hw_cap {
  type hw
  card XVF3800
  device 1
}

ctl.xvf_hw {
  type hw
  card XVF3800
}

pcm.xvf_cap_rt {
  type dsnoop
  # Pick widely-separated keys for dsnoop and dmix so the per-segment
  # derived shm keys never overlap, regardless of slave format/rate hash.
  ipc_key 0x10000
  ipc_perm 0666
  slave {
    pcm "xvf_hw_cap"
    rate 48000
    format S32_LE
    channels 2
    period_time 0
    period_size 1024
    buffer_size 8192
  }
}

pcm.xvf_cap {
  type plug
  slave.pcm "xvf_cap_rt"
}

pcm.xvf_dmix {
  type dmix
  ipc_key 0x20000
  ipc_perm 0666
  slave {
    pcm "xvf_hw_play"
    rate 48000
    format S16_LE
    channels 2
    period_time 0
    period_size 1024
    buffer_size 16384
  }
}

pcm.xvf_softvol {
  type softvol
  slave.pcm "xvf_dmix"
  control {
    name "XVF3800 SoftMaster"
    card XVF3800
  }
  min_dB -60.0
  max_dB 0.0
  resolution 256
}

pcm.xvf_out {
  type plug
  slave.pcm "xvf_softvol"
}

pcm.!default {
  type asym
  playback.pcm "xvf_out"
  capture.pcm  "xvf_cap"
}

ctl.!default {
  type hw
  card XVF3800
}
